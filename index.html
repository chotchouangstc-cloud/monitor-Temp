<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLA Master Pro - ระบบตกแต่งรูปภาพ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-indigo: #5856D6;
            --ios-red: #FF3B30;
        }

        body {
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #d1d9e6;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(88, 86, 214, 0.2) 0%, transparent 50%), 
                radial-gradient(circle at 90% 20%, rgba(52, 199, 89, 0.15) 0%, transparent 50%), 
                radial-gradient(circle at 50% 80%, rgba(0, 122, 255, 0.2) 0%, transparent 60%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #1c1c1e;
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.25) 100%);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 1.8rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        #canvas-container {
            background: rgba(255, 255, 255, 0.3);
            border: 2px dashed rgba(0, 122, 255, 0.4);
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }

        #canvas-container.dragover {
            border-color: var(--ios-blue);
            background: rgba(0, 122, 255, 0.1);
        }

        .ios-btn {
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .ios-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }
        .ios-btn:active {
            transform: scale(0.97);
        }

        .color-swatch {
            transition: all 0.15s ease;
        }
        .color-swatch:hover {
            transform: scale(1.15);
        }
        .color-swatch.active {
            ring: 3px solid #007AFF;
            transform: scale(1.1);
        }
    </style>
</head>
<body class="p-3 sm:p-4 lg:p-6 min-h-screen flex items-center justify-center">

    <!-- Main Side-by-Side Container -->
    <div class="w-full max-w-[1500px] flex flex-col lg:flex-row gap-4 lg:gap-6 items-stretch">
        
        <!-- LEFT SIDEBAR: Controls -->
        <aside class="w-full lg:w-[380px] shrink-0 glass-panel p-3.5 sm:p-4 lg:p-5 flex flex-col justify-between space-y-3 lg:space-y-4">
            
            <div class="space-y-3 lg:space-y-4">
                <!-- Group Temp & TG Wrapper (Side by Side on half-screen) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-3">
                    <!-- Group Temp -->
                    <div>
                        <div class="flex items-center gap-2 mb-1.5 lg:mb-2">
                            <span class="px-2.5 py-0.5 lg:px-3 lg:py-1 rounded-full text-[10px] lg:text-[11px] font-black tracking-widest text-rose-600 bg-rose-500/10 border border-rose-400/30 shadow-sm backdrop-blur-md inline-flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 lg:w-2 lg:h-2 rounded-full bg-rose-500 animate-pulse"></span>
                                TEMP
                            </span>
                        </div>
                        <div class="grid grid-cols-2 gap-1.5 sm:gap-2">
                            <button onclick="addText('Temp กะ A 05.00-14.00')" class="ios-btn bg-[#007AFF] text-white p-2 lg:p-3 rounded-xl lg:rounded-2xl text-[11px] lg:text-xs font-bold shadow-md shadow-blue-500/20 text-center">
                                <div class="text-[160px] lg:text-[16px] opacity-80 mb-0.5">กะ A</div>
                                05.00 - 14.00
                            </button>
                            <button onclick="addText('Temp กะ B 14.00-23.00')" class="ios-btn bg-[#34C759] text-white p-2 lg:p-3 rounded-xl lg:rounded-2xl text-[11px] lg:text-xs font-bold shadow-md shadow-green-500/20 text-center">
                                <div class="text-[16px] lg:text-[16px] opacity-80 mb-0.5">กะ B</div>
                                14.00 - 23.00
                            </button>
                        </div>
                    </div>

                    <!-- Group TG -->
                    <div>
                        <div class="flex items-center gap-2 mb-1.5 lg:mb-2">
                            <span class="px-2.5 py-0.5 lg:px-3 lg:py-1 rounded-full text-[10px] lg:text-[11px] font-black tracking-widest text-red-600 bg-red-500/10 border border-red-400/30 shadow-sm backdrop-blur-md inline-flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 lg:w-2 lg:h-2 rounded-full bg-red-500"></span>
                                TG
                            </span>
                        </div>
                        <div class="grid grid-cols-3 gap-1.5 sm:gap-2">
                            <button onclick="addText('TG กะ A 05.00-14.00')" class="ios-btn bg-[#007AFF] text-white p-2 lg:p-2.5 rounded-xl lg:rounded-2xl text-[10px] lg:text-[11px] font-bold shadow-md shadow-blue-500/20 text-center">
                                <div class="text-[7px] lg:text-[8px] opacity-80 mb-0.5">SHIFT A</div>
                                05.00 - 14.00
                            </button>
                            <button onclick="addText('TG กะ B 13.00-22.00')" class="ios-btn bg-[#34C759] text-white p-2 lg:p-2.5 rounded-xl lg:rounded-2xl text-[10px] lg:text-[11px] font-bold shadow-md shadow-green-500/20 text-center">
                                <div class="text-[7px] lg:text-[8px] opacity-80 mb-0.5">SHIFT B</div>
                                13.00 - 22.00
                            </button>
                            <button onclick="addText('TG กะ C 21.00-05.00')" class="ios-btn bg-[#5856D6] text-white p-2 lg:p-2.5 rounded-xl lg:rounded-2xl text-[10px] lg:text-[11px] font-bold shadow-md shadow-indigo-500/20 text-center">
                                <div class="text-[7px] lg:text-[8px] opacity-80 mb-0.5">SHIFT C</div>
                                21.00 - 05.00
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Custom Input & Color Palette Wrapper -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-2 sm:gap-3 items-center">
                    <!-- Custom Input -->
                    <div class="flex gap-2 p-1 bg-white/40 rounded-full border border-white/60 shadow-inner">
                        <input type="text" id="custom-text-input" placeholder="พิมพ์ข้อความ..." class="flex-1 px-3 py-1.5 lg:px-4 lg:py-2 bg-transparent text-xs font-semibold text-slate-800 focus:outline-none" onkeypress="if(event.key === 'Enter') applyCustomText()">
                        <button onclick="applyCustomText()" class="ios-btn px-3 py-1.5 lg:px-4 lg:py-2 bg-[#1c1c1e] text-white text-xs rounded-full font-bold shadow-md flex items-center gap-1 shrink-0">
                            + เพิ่ม
                        </button>
                    </div>

                    <!-- Color Palette Section -->
                    <div class="bg-white/40 p-2.5 lg:p-3.5 rounded-2xl border border-white/60">
                        <div class="flex items-center justify-between mb-1.5 lg:mb-2">
                            <label class="text-xs font-bold text-slate-700">เลือกสี</label>
                            <input type="color" id="custom-color-picker" class="w-5 h-5 lg:w-6 lg:h-6 rounded-full border-none cursor-pointer bg-transparent" title="เลือกสีอื่นๆ">
                        </div>
                        <div id="color-palette" class="grid grid-cols-8 gap-1.5 lg:gap-2 p-0.5"></div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons Area -->
            <div class="space-y-1.5 lg:space-y-2 pt-1">
                <div class="grid grid-cols-2 lg:grid-cols-1 gap-2">
                    <button id="btn-clear" class="ios-btn py-2.5 lg:py-3.5 bg-white/70 border border-white/90 rounded-xl lg:rounded-2xl font-bold text-slate-600 hover:text-red-500 shadow-sm flex items-center justify-center gap-1.5 lg:gap-2">
                        <svg class="w-5 h-5 lg:w-6 lg:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        <span class="text-xs lg:text-sm font-extrabold tracking-wide">ล้าง</span>
                    </button>

                    <button id="btn-copy-img" class="ios-btn py-2.5 lg:py-4 bg-[#1c1c1e] text-white rounded-xl lg:rounded-2xl font-bold shadow-lg shadow-black/20 flex items-center justify-center gap-1.5 lg:gap-2">
                        <svg class="w-5 h-5 lg:w-6 lg:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        <span class="text-xs lg:text-sm font-extrabold tracking-wide">คัดลอก</span>
                    </button>
                </div>
            </div>
            
        </aside>

        <!-- RIGHT SIDE: Canvas Editor Workspace -->
        <main class="flex-1 glass-panel p-3 sm:p-4 flex flex-col items-center justify-center relative min-h-[400px] lg:min-h-[500px]">
            <div id="canvas-container" class="w-full h-full min-h-[380px] lg:min-h-[520px] flex items-center justify-center relative overflow-hidden p-2">
                <div id="placeholder-text" class="text-center p-6 lg:p-8 transition-transform hover:scale-105">
                    <div class="w-12 h-12 lg:w-16 lg:h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-2 lg:mb-3 text-[#007AFF]">
                        <svg class="w-6 h-6 lg:w-8 lg:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    </div>
                    <p class="text-base lg:text-lg font-bold text-slate-800 mb-1">วางรูปภาพ (Ctrl+V)</p>
                    <p class="text-slate-500 text-xs">หรือลากไฟล์มาวางบริเวณนี้</p>
                </div>
                <canvas id="editor-canvas" class="hidden max-w-full max-h-[75vh] lg:max-h-[80vh] rounded-2xl shadow-lg"></canvas>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 px-5 py-2.5 bg-[#1c1c1e] text-white text-xs font-bold rounded-full shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-50 flex items-center gap-2">
        <span id="toast-msg">Success</span>
    </div>

    <script>
        const canvas = document.getElementById('editor-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const placeholder = document.getElementById('placeholder-text');

        const colors = [
            '#000000', '#3A3A3C', '#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#007AFF', '#5856D6',
            '#FFFFFF', '#8E8E93', '#FF2D55', '#FFD60A', '#30D158', '#64D2FF', '#0A84FF', '#BF5AF2'
        ];
        let currentColor = '#007AFF';

        let currentImage = null;
        let texts = [];
        let selectedIndex = -1;

        let isDragging = false;
        let isResizing = false;
        let activeHandle = null;
        let dragOffset = { x: 0, y: 0 };
        let initialResizeState = null;

        const paletteContainer = document.getElementById('color-palette');
        const customColorPicker = document.getElementById('custom-color-picker');

        colors.forEach((color) => {
            const btn = document.createElement('button');
            btn.className = `w-5 h-5 lg:w-6 lg:h-6 rounded-full color-swatch border border-slate-300 shadow-sm flex items-center justify-center`;
            btn.style.backgroundColor = color;
            btn.onclick = () => selectColor(color);
            paletteContainer.appendChild(btn);
        });

        customColorPicker.oninput = (e) => selectColor(e.target.value);

        function selectColor(hex) {
            currentColor = hex;
            if (selectedIndex !== -1) {
                texts[selectedIndex].color = hex;
                renderCanvas();
            }
        }

        window.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            for (let item of items) {
                if (item.type.indexOf('image') !== -1) {
                    handleImageFile(item.getAsFile());
                }
            }
        });

        container.addEventListener('dragover', (e) => { e.preventDefault(); container.classList.add('dragover'); });
        container.addEventListener('dragleave', () => container.classList.remove('dragover'));
        container.addEventListener('drop', (e) => {
            e.preventDefault();
            container.classList.remove('dragover');
            if (e.dataTransfer.files[0]) handleImageFile(e.dataTransfer.files[0]);
        });

        function handleImageFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    texts = [];
                    selectedIndex = -1;
                    placeholder.classList.add('hidden');
                    canvas.classList.remove('hidden');
                    renderCanvas();
                    showToast("วางรูปภาพเรียบร้อย");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function addText(textStr) {
            if (!currentImage) return showToast("กรุณาวางรูปภาพก่อนเพิ่มข้อความ", true);
            
            const newText = {
                text: textStr,
                x: canvas.width / 2,
                y: canvas.height / 3 + (texts.length * 30),
                color: currentColor,
                size: 36
            };
            texts.push(newText);
            selectedIndex = texts.length - 1;
            renderCanvas();
        }

        function applyCustomText() {
            const input = document.getElementById('custom-text-input');
            if (input.value.trim()) {
                addText(input.value.trim());
                input.value = '';
            }
        }

        function getTextBounds(t) {
            ctx.font = `800 ${t.size}px Sarabun, sans-serif`;
            const metrics = ctx.measureText(t.text);
            const w = metrics.width;
            const h = t.size;
            const padX = 12;
            const padY = 6;

            const left = t.x - w / 2 - padX;
            const right = t.x + w / 2 + padX;
            const top = t.y - padY;
            const bottom = t.y + h + padY;

            const handleRadius = Math.max(5, Math.min(10, t.size * 0.2));
            const deleteRadius = Math.max(8, Math.min(14, t.size * 0.3));

            return {
                left, right, top, bottom, width: right - left, height: bottom - top,
                center: { x: t.x, y: t.y + h / 2 },
                handles: {
                    tl: { x: left, y: top, r: handleRadius },
                    tr: { x: right, y: top, r: handleRadius },
                    bl: { x: left, y: bottom, r: handleRadius },
                    br: { x: right, y: bottom, r: handleRadius }
                },
                deleteBtn: {
                    x: (left + right) / 2,
                    y: top - deleteRadius - 8,
                    r: deleteRadius
                }
            };
        }

        function renderCanvas() {
            if (!currentImage) return;
            canvas.width = currentImage.width;
            canvas.height = currentImage.height;
            ctx.drawImage(currentImage, 0, 0);

            texts.forEach((t, i) => {
                ctx.font = `800 ${t.size}px Sarabun, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';

                ctx.strokeStyle = 'white';
                ctx.lineWidth = Math.max(2, t.size * 0.18);
                ctx.lineJoin = 'round';
                ctx.strokeText(t.text, t.x, t.y);

                ctx.fillStyle = t.color;
                ctx.fillText(t.text, t.x, t.y);

                if (i === selectedIndex) {
                    const bounds = getTextBounds(t);

                    ctx.strokeStyle = '#007AFF';
                    ctx.lineWidth = Math.max(1.5, canvas.width * 0.002);
                    ctx.beginPath();
                    ctx.roundRect(bounds.left, bounds.top, bounds.width, bounds.height, 6);
                    ctx.stroke();

                    const del = bounds.deleteBtn;
                    ctx.beginPath();
                    ctx.arc(del.x, del.y, del.r, 0, Math.PI * 2);
                    ctx.fillStyle = '#FF3B30';
                    ctx.fill();
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = Math.max(1.5, del.r * 0.25);
                    ctx.beginPath();
                    const cross = del.r * 0.4;
                    ctx.moveTo(del.x - cross, del.y - cross);
                    ctx.lineTo(del.x + cross, del.y + cross);
                    ctx.moveTo(del.x + cross, del.y - cross);
                    ctx.lineTo(del.x - cross, del.y + cross);
                    ctx.stroke();

                    Object.values(bounds.handles).forEach(h => {
                        ctx.beginPath();
                        ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
                        ctx.fillStyle = '#007AFF';
                        ctx.fill();
                        ctx.strokeStyle = '#FFFFFF';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    });
                }
            });
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            const pos = getCanvasCoords(e);

            if (selectedIndex !== -1) {
                const bounds = getTextBounds(texts[selectedIndex]);
                const del = bounds.deleteBtn;
                if (Math.hypot(pos.x - del.x, pos.y - del.y) <= del.r * 1.3) {
                    texts.splice(selectedIndex, 1);
                    selectedIndex = -1;
                    renderCanvas();
                    showToast("ลบข้อความแล้ว");
                    return;
                }

                for (let key in bounds.handles) {
                    const h = bounds.handles[key];
                    if (Math.hypot(pos.x - h.x, pos.y - h.y) <= h.r * 1.5) {
                        isResizing = true;
                        activeHandle = key;
                        initialResizeState = {
                            center: bounds.center,
                            startDist: Math.hypot(pos.x - bounds.center.x, pos.y - bounds.center.y),
                            startSize: texts[selectedIndex].size
                        };
                        return;
                    }
                }
            }

            let clickedIdx = -1;
            for (let i = texts.length - 1; i >= 0; i--) {
                const b = getTextBounds(texts[i]);
                if (pos.x >= b.left && pos.x <= b.right && pos.y >= b.top && pos.y <= b.bottom) {
                    clickedIdx = i;
                    break;
                }
            }

            if (clickedIdx !== -1) {
                selectedIndex = clickedIdx;
                currentColor = texts[selectedIndex].color;
                isDragging = true;
                dragOffset = {
                    x: pos.x - texts[selectedIndex].x,
                    y: pos.y - texts[selectedIndex].y
                };
            } else {
                selectedIndex = -1;
            }
            renderCanvas();
        });

        canvas.addEventListener('mousemove', (e) => {
            const pos = getCanvasCoords(e);

            if (isResizing && selectedIndex !== -1) {
                const currentDist = Math.hypot(pos.x - initialResizeState.center.x, pos.y - initialResizeState.center.y);
                const scaleRatio = currentDist / initialResizeState.startDist;
                let newSize = Math.round(initialResizeState.startSize * scaleRatio);
                newSize = Math.max(8, Math.min(300, newSize));
                
                texts[selectedIndex].size = newSize;
                renderCanvas();
                return;
            }

            if (isDragging && selectedIndex !== -1) {
                texts[selectedIndex].x = pos.x - dragOffset.x;
                texts[selectedIndex].y = pos.y - dragOffset.y;
                renderCanvas();
                return;
            }

            if (selectedIndex !== -1) {
                const bounds = getTextBounds(texts[selectedIndex]);
                const del = bounds.deleteBtn;
                if (Math.hypot(pos.x - del.x, pos.y - del.y) <= del.r * 1.3) {
                    canvas.style.cursor = 'pointer';
                    return;
                }

                let hoveringHandle = false;
                for (let key in bounds.handles) {
                    const h = bounds.handles[key];
                    if (Math.hypot(pos.x - h.x, pos.y - h.y) <= h.r * 1.5) {
                        canvas.style.cursor = (key === 'tl' || key === 'br') ? 'nwse-resize' : 'nesw-resize';
                        hoveringHandle = true;
                        break;
                    }
                }
                if (hoveringHandle) return;

                if (pos.x >= bounds.left && pos.x <= bounds.right && pos.y >= bounds.top && pos.y <= bounds.bottom) {
                    canvas.style.cursor = 'move';
                    return;
                }
            }
            canvas.style.cursor = 'default';
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            isResizing = false;
            activeHandle = null;
        });

        window.addEventListener('keydown', (e) => {
            if (selectedIndex !== -1 && (e.key === 'Delete' || e.key === 'Backspace')) {
                if (document.activeElement.tagName === 'INPUT') return;
                texts.splice(selectedIndex, 1);
                selectedIndex = -1;
                renderCanvas();
                showToast("ลบข้อความแล้ว");
            }
        });

        document.getElementById('btn-clear').onclick = () => {
            currentImage = null;
            texts = [];
            selectedIndex = -1;
            canvas.classList.add('hidden');
            placeholder.classList.remove('hidden');
            showToast("ล้างข้อมูลเรียบร้อย");
        };

        document.getElementById('btn-copy-img').onclick = () => {
            if (!currentImage) return showToast("ไม่มีรูปภาพสำหรับคัดลอก", true);
            const prevSel = selectedIndex;
            selectedIndex = -1;
            renderCanvas();

            canvas.toBlob((blob) => {
                navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                showToast("คัดลอกรูปภาพลง Clipboard แล้ว");
                selectedIndex = prevSel;
                renderCanvas();
            });
        };

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.style.backgroundColor = isError ? '#FF3B30' : '#1c1c1e';
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.add('opacity-0');
                toast.classList.remove('opacity-100');
            }, 2500);
        }
    </script>
</body>
</html>
